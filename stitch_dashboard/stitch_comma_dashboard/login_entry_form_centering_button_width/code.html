<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --comma-blue: #0052FF;
        --border-soft: #E5E7EB;
      }
      .font-outfit {
        font-family: 'Outfit', sans-serif;
      }
      .font-inter {
        font-family: 'Inter', sans-serif;
      }
      .mesh-gradient {
        background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                    radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                    radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-color: #000814;
        background-image: radial-gradient(at 88% 48%, hsla(221,100%,50%,0.3) 0px, transparent 50%),
                          radial-gradient(at 0% 46%, hsla(210,100%,36%,0.4) 0px, transparent 50%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      }
    </style>

<body class="font-inter antialiased bg-white h-screen w-full flex overflow-hidden text-[#0d121b]">

<div class="w-full mb-8 text-center">
<h1 class="font-outfit text-4xl font-bold text-[#0d121b] mb-3 tracking-tight">Welcome Back</h1>
<p class="text-gray-500 text-sm font-medium">Enter your credentials to access your dashboard.</p>
</div>
<form class="w-full space-y-5">
<div class="space-y-1.5">
<label class="block text-sm font-medium text-[#0d121b]" for="email">Email</label>
<input class="block w-full h-12 px-4 rounded-2xl border border-[#E5E7EB] bg-white shadow-sm text-[#0d121b] placeholder:text-gray-400 focus:ring-2 focus:ring-[#0052FF]/20 focus:border-[#0052FF] sm:text-base font-inter transition-all outline-none" id="email" placeholder="Enter your email" type="email"/>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium text-[#0d121b]" for="password">Password</label>
<input class="block w-full h-12 px-4 rounded-2xl border border-[#E5E7EB] bg-white shadow-sm text-[#0d121b] placeholder:text-gray-400 focus:ring-2 focus:ring-[#0052FF]/20 focus:border-[#0052FF] sm:text-base font-inter transition-all outline-none" id="password" placeholder="Enter your password" type="password"/>
</div>
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-gray-300 text-[#0052FF] focus:ring-[#0052FF]" type="checkbox"/>
<span class="text-sm text-gray-500 font-medium">Remember me</span>
</label>
<a class="text-sm font-semibold text-[#0052FF] hover:text-blue-700" href="#">Forgot password?</a>
</div>
<button class="w-full h-12 mt-2 flex justify-center items-center rounded-2xl bg-gradient-to-b from-[#0052FF] to-[#0046db] text-white font-outfit font-bold tracking-wide shadow-[inset_0_1px_0_0_rgba(255,255,255,0.2)] border border-[#E5E7EB] hover:shadow-lg transition-all active:scale-[0.99]" type="button">
            Sign In
          </button>
</form>
<div class="mt-8 text-center text-sm text-gray-500 font-medium">
          Don't have an account? <a class="font-bold text-[#0052FF] hover:underline" href="#">Sign up</a>
</div>
</div>
</div>
<div class="hidden lg:flex lg:w-1/2 relative overflow-hidden mesh-gradient items-center justify-center">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#0052FF] rounded-full mix-blend-overlay blur-[128px] opacity-40"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-[#2d5bff] rounded-full mix-blend-overlay blur-[128px] opacity-30"></div>

<div class="relative w-full max-w-lg p-8 rounded-[32px] glass-card flex flex-col gap-6 transform translate-y-8">
<div class="flex items-end justify-between h-32 px-4 gap-4">
<div class="w-full bg-white/10 rounded-t-lg h-[40%] animate-pulse"></div>

<div class="w-full bg-[#0052FF] rounded-t-lg h-[85%] shadow-[0_0_30px_rgba(0,82,255,0.4)] relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
<div class="w-full bg-white/10 rounded-t-lg h-[55%]"></div>
<div class="w-full bg-white/5 rounded-t-lg h-[30%]"></div>
</div>
<div class="space-y-2">
<h3 class="font-outfit text-2xl font-bold text-white leading-tight">Data-Driven Growth</h3>
<p class="text-white/60 font-inter text-sm leading-relaxed">
             Experience the new standard in SEO analytics. Real-time tracking and premium insights designed for scale.
           </p>
</div>
<div class="flex gap-2 pt-2">
<div class="w-2 h-2 rounded-full bg-white"></div>
<div class="w-2 h-2 rounded-full bg-white/20"></div>
<div class="w-2 h-2 rounded-full bg-white/20"></div>
</div>
</div>
